<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebCardápio - Cadastro</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body data-pagina="cadastro">
        <div class="login-container">
            <img src="img/logo.png" alt="Logo WebCardápio" class="logo-login">
            <h1>Criar Conta</h1>
            <form>
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input id="nome" name="nome" type="text" placeholder="Digite seu nome completo" required>
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" required>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" type="tel" placeholder="(63) 99999-9999" required>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="campo">
                    <label for="senha">Criar senha</label>
                    <input id="senha" name="senha" type="password" placeholder="Mínimo de 6 caracteres" required>
                </div>
                <div class="campo">
                    <label for="confirmar">Confirmar senha</label>
                    <input id="confirmar" name="confirmar" type="password" placeholder="Repita a senha" required>
                </div>
                <p id="erro" class="erro" role="alert"></p>
                <button type="submit">Cadastrar</button>
            </form>
            <p class="cadastro-link">Já possui uma conta? <a href="login.html">Entrar</a></p>
        </div>
        <script src="js/dados.js"></script>
        <script src="js/cliente.js"></script>
    </body>
</html>
