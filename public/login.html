<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebCardápio - Login</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body data-pagina="login">
        <div class="login-container">
            <img src="img/logo.png" alt="Logo WebCardápio" class="logo-login">
            <h1>Entrar</h1>
            <form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required>
                </div>
                <p id="erro" class="erro" role="alert"></p>
                <button type="submit">Entrar</button>
            </form>
            <p class="cadastro-link">Ainda não possui uma conta? <a href="cadastro.html">Criar Conta</a></p>
            <p class="cadastro-link">Conta de teste: cliente@teste.com / 123456</p>
            <a href="index.html" class="voltar">Voltar para a página inicial</a>
        </div>
        <script src="js/dados.js"></script>
        <script src="js/cliente.js"></script>
    </body>
</html>
